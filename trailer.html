<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<title>Karo Schlauer – Trailer</title>
<meta name="description" content="Der Trailer zu Karo Schlauer: Mathe und Englisch üben, ab dem 30.09.2026.">
<style>
:root{--bg:#0b1230; --ink:#fff; --brand:#3d6ff0; --gold:#ffc83d}
*{box-sizing:border-box}
html,body{margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{min-height:100vh; display:flex; flex-direction:column; align-items:center; gap:18px; padding:24px 16px 32px}
h1{margin:0; font-size:26px; text-align:center}
h1 b{color:var(--gold)}
video{width:100%; max-width:380px; aspect-ratio:9/16; border-radius:18px; background:#000; box-shadow:0 20px 50px rgba(0,0,0,.5)}
.knoepfe{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; width:100%; max-width:380px}
a.btn{flex:1 1 160px; display:inline-flex; justify-content:center; align-items:center; gap:8px; padding:14px 18px; border-radius:14px; font-weight:800; font-size:17px; text-decoration:none; color:#fff; background:var(--brand)}
a.btn.zwei{background:rgba(255,255,255,.12)}
p{margin:0; max-width:380px; text-align:center; color:#c9d6ff; font-size:15px; line-height:1.5}
</style>
</head>
<body>
<main>
  <h1>Karo <b>Schlauer</b> – Trailer</h1>
  <video src="trailer.mp4" controls playsinline preload="metadata"></video>
  <div class="knoepfe">
    <a class="btn" href="trailer.mp4" download="karo-schlauer-trailer.mp4">⬇ Herunterladen</a>
    <a class="btn zwei" href="./">Zur App</a>
  </div>
  <p>Am Handy: Klappt „Herunterladen“ nicht, das Video lange gedrückt halten und „Video sichern“ wählen.</p>
